version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/keywordad", "/moment"]
    schedule:
      interval: weekly
    labels: ["dependencies", "go"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
