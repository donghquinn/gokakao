name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - run: |
          for m in . keywordad moment; do (cd "$m" && go vet ./...); done

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: keywordad

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: moment
