name: Release

# Creates a GitHub release with generated notes when a version tag is
# pushed. pkg.go.dev picks up the tag on its own.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: go test -race ./...

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" $flags
