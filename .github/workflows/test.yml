name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Check go mod tidy
        run: |
          for m in . keywordad moment; do (cd "$m" && go mod tidy); done
          git diff --exit-code -- '**go.mod' '**go.sum'

      - name: Test
        run: |
          go test -race -shuffle=on -coverprofile=coverage.out ./...
          for m in keywordad moment; do
            (cd "$m" && go test -race -shuffle=on -coverprofile=coverage.out ./...)
          done

      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out,./keywordad/coverage.out,./moment/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
