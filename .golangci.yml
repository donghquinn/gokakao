version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - thelper
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: internal/kakaotest/
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
